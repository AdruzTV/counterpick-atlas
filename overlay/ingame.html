<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title data-i18n="ov.title">CounterAtlas · overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Jost:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="overlay/css/overlay.css">
</head>
<body>
<div class="panel">
  <header class="head" id="drag">
    <span class="brand-mark" aria-hidden="true"></span>
    <strong>Counter<span>Atlas</span></strong>
    <span class="status" id="status" aria-live="polite" data-i18n="ov.loading">Načítám data…</span>
    <button type="button" class="ic" data-act="calib" title="Kalibrace scoreboardu" aria-label="Kalibrace scoreboardu" data-i18n-attr="title:ov.calib; aria-label:ov.calib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
    <button type="button" class="ic x" data-act="close" title="Skrýt" aria-label="Skrýt" data-i18n-attr="title:ov.hide; aria-label:ov.hide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div class="body" id="body"></div>
  <footer class="foot">
    <button type="button" class="btn go" data-act="confirm" id="confirm" disabled data-i18n="ov.confirm">✓ Sedí, uložit</button>
    <span class="hint" id="keys"></span>
  </footer>
  <div class="picker" id="picker" hidden></div>
  <div class="grip" id="grip" aria-hidden="true"></div>
</div>
<script src="js/i18n.js"></script>
<script src="js/counterpick-core.js"></script>
<script src="js/scoreboard.js"></script>
<script src="overlay/js/app.js"></script>
<script src="overlay/js/ingame.js"></script>
</body>
</html>

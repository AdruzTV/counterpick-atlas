<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title data-i18n="cal.title">Counterpick · nastavení skenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Jost:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="overlay/css/overlay.css">
<style>
/* Scan settings: the last screenshot with the portrait boxes on the left, the settings in cards on the right. */
.cal { --ground: #121926; --surface: #1A2232; --soft: #222C3E; --ink: #EEF2F7; --ink-2: #A6B0C0;
  position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--ground); font-size: 15px; }
.cal .head { height: 52px; box-sizing: border-box; background: #0B0F17; border-bottom-color: #2E3A4F; }
.cal-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
.stage { position: relative; min-width: 0; min-height: 0; background: #0B0F17; display: grid; place-items: center; overflow: hidden; padding: 12px; }
.stage canvas { max-width: 100%; max-height: 100%; cursor: grab; border-radius: 6px; }
.stage canvas.dragging { cursor: grabbing; }
.stage .empty-msg { max-width: 46ch; background: #1F2939; }
.side { overflow-y: auto; padding: 14px 18px 18px; display: grid; gap: 14px; align-content: start; border-left: 1px solid #2E3A4F; }
.card { background: var(--surface); border-radius: 12px; padding: 14px 16px 16px; color: var(--ink); }
.card h2 { margin: 0 0 8px; font: 600 17px/1.2 var(--f-ui); }
.steps { margin: 0 0 10px; padding-left: 20px; display: grid; gap: 5px; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
.steps b { color: var(--ink); font-weight: 600; }
.opt-row { display: grid; grid-template-columns: 118px auto; justify-content: start; align-items: center; gap: 10px; margin-top: 8px; }
.card .seg { background: var(--ground); }
.card .seg-btn { height: 40px; padding: 0 14px; font-size: 14px; }
.range { display: grid; grid-template-columns: 118px minmax(0, 1fr) 56px; gap: 10px; align-items: center; margin-top: 8px; font-size: 14px; }
.range input[type=range] { width: 100%; accent-color: var(--orange); }
.range output { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.card .btn { background: var(--surface); }
.card .btn:hover { background: var(--soft); }
.prev { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
.prev div { display: grid; justify-items: center; gap: 3px; padding: 5px 2px; border-radius: 7px; background: var(--soft); box-shadow: inset 0 3px 0 var(--ally); min-width: 0; }
.prev.enemy div { box-shadow: inset 0 3px 0 var(--enemy); }
.prev img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; }
.prev span { max-width: 100%; font: italic 800 12px/1.05 var(--f-game); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--orange); }
.prev .sure span { color: var(--ink); }
.small { color: var(--ink-2); font-size: 13.5px; line-height: 1.45; margin: 8px 0 0; }
.small.top { margin-top: 0; }
.small.bad { color: var(--orange); }
.keyrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 4px 0; }
.btn.key { min-width: 130px; height: 44px; border-radius: 9px; font-weight: 600; }
.btn.key kbd { border: 0; padding: 0; font-size: 15px; }
.btn.key.on { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
@media (max-width: 860px) { .cal-main { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 1fr) auto; } .side { border-left: 0; max-height: 50vh; } }
</style>
</head>
<body class="page">
<div class="cal">
  <header class="head" id="drag">
    <span class="brand-mark" aria-hidden="true">CA</span>
    <strong data-i18n="cal.head">Nastavení <span>skenu</span></strong>
    <span class="status" id="status" role="status"></span>
    <button type="button" class="ic x" data-act="close" title="Zavřít" aria-label="Zavřít" data-i18n-attr="title:ov.close; aria-label:ov.close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div class="cal-main">
    <div class="stage" id="stage"><p class="empty-msg" data-i18n="cal.loading">Načítám…</p></div>
    <aside class="side" id="side"></aside>
  </div>
  <div class="grip" id="grip" aria-hidden="true"></div>
</div>
<script src="js/i18n.js"></script>
<script src="js/counterpick-core.js"></script>
<script src="js/scoreboard.js"></script>
<script src="overlay/js/app.js"></script>
<script src="overlay/js/calibrate.js"></script>
</body>
</html>
